name: Compilar ISO Customizada
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  bluebuild:
    name: Compilar Imagem com BlueBuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Executar o BlueBuild
        uses: blue-build/github-action@v1.8.1
        with:
          recipe: 'recipe.yml'
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
