# Local no repositório: .github/workflows/build.yml
#
# 1) Job "imagem": compila a imagem com o BlueBuild e publica no GHCR.
#    Roda todo dia, a cada push e sob demanda.
# 2) Job "iso": gera a ISO instalável a partir da imagem publicada.
#    Só roda sob demanda (Actions > este workflow > Run workflow), pois a ISO
#    não precisa ser refeita a cada atualização: o sistema instalado se
#    atualiza sozinho pela imagem.
#
# Pré-requisitos (uma vez só):
#   - Secret SIGNING_SECRET com o conteúdo de cosign.key
#     (gerado com: cosign generate-key-pair) e cosign.pub commitado na raiz.
#   - Pacote da imagem PÚBLICO no GHCR (o job "iso" lê a imagem sem login):
#     perfil > Packages > <nome da imagem> > Package settings > Change visibility.
name: Compilar imagem e gerar ISO

on:
  schedule:
    - cron: '23 6 * * *'   # todo dia às 06:23 UTC (03:23 em Brasília)
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      gerar_iso:
        description: 'Gerar também a ISO instalável (leva de 30 a 60 min)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagem:
    name: Compilar imagem (BlueBuild)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # A própria action faz o checkout do repositório.
      - name: Compilar com o BlueBuild
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

  iso:
    name: Gerar ISO instalável
    needs: imagem
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gerar_iso }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Ler nome e versão da receita
        id: meta
        run: |
          set -euo pipefail
          name="$(yq '.name' recipes/recipe.yml)"
          version="$(yq '.["image-version"]' recipes/recipe.yml)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ -z "$name" || "$name" == "null" ]]; then
            echo "::error::Não encontrei 'name' em recipes/recipe.yml"; exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "::error::'image-version' precisa ser um número (ex.: 44) para gerar a ISO; encontrei '${version}'"; exit 1
          fi
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "repo=ghcr.io/${owner}"
            echo "ref=ghcr.io/${owner}/${name}:latest"
            echo "iso=${name}-${version}-$(date -u +%Y%m%d).iso"
          } >> "$GITHUB_OUTPUT"

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Conferir se a imagem está pública no GHCR
        env:
          REF: ${{ steps.meta.outputs.ref }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          if ! docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "::error title=Imagem não acessível::Não consegui ler ${REF} sem login. Torne o pacote público (perfil > Packages > ${NAME} > Package settings > Change visibility > Public) e use 'Re-run failed jobs'."
            exit 1
          fi

      - name: Gerar a ISO
        id: build
        uses: jasonn3/build-container-installer@v1.5.0
        with:
          arch: x86_64
          image_name: ${{ steps.meta.outputs.name }}
          image_repo: ${{ steps.meta.outputs.repo }}
          image_tag: latest
          image_signed: true
          version: ${{ steps.meta.outputs.version }}
          variant: Silverblue   # só afeta o instalador (Anaconda); a imagem instalada é a sua (COSMIC)
          iso_name: ${{ steps.meta.outputs.iso }}

      - name: Enviar a ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Resumo
        env:
          ISO_NAME: ${{ steps.build.outputs.iso_name }}
        run: |
          {
            echo "### ISO gerada"
            echo
            echo "- Arquivo: \`${ISO_NAME}\` (baixe em **Artifacts**, no fim desta página; vem dentro de um .zip)"
            echo "- Integridade: \`sha256sum -c ${ISO_NAME}-CHECKSUM\`"
            echo "- Disponível por 14 dias."
          } >> "$GITHUB_STEP_SUMMARY"
