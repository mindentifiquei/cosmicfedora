name: cosmic-hardened
description: Fedora Cosmic em estado de isolamento total, livre de BigTechs, telemetria oculta e daemons desnecessários.
base-image: ghcr.io/ublue-os/cosmic-main
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - opensnitch # Injeta o firewall interativo na raiz imutável
    remove:
      # --- 1. TELEMETRIA, DIAGNÓSTICOS E RELATÓRIOS DA RED HAT ---
      - abrt
      - abrt-cli
      - abrt-addon-ccpp
      - abrt-addon-kerneloops
      - abrt-plugin-sosreport
      - sos
      - redhat-support-tool         # Ferramenta de suporte automatizado para servidores Red Hat
      - redhat-support-lib-python    # Biblioteca de envio de dados de diagnóstico

      # --- 2. INTEGRAÇÕES CLOUD E ASSISTÊNCIA REMOTA ---
      - NetworkManager-cloud-setup   # Evita varredura de metadados em nuvens AWS/Azure/GCP
      - geoclue2                     # API de Geolocalização (Corta o rastreamento por IP/Wi-Fi)
      - ssnid                        # Telemetria básica de identificação de rede
      - rng-tools                    # Previne envio de entropia para servidores externos
      - spice-vdagent                # Ferramenta para máquinas virtuais e acessos remotos comerciais
      - qemu-guest-agent             # Agente de monitoramento em segundo plano (inútil em hardware real)

      # --- 3. BISBILHOTADORES LOCAIS E INDEXADORES DE ARQUIVOS ---
      - tracker3                     # Indexador que lê todos os seus arquivos pessoais
      - tracker3-miners              # O minerador de arquivos em segundo plano
      - mlocate                      # Indexador legado de arquivos locais que roda via cron diariamente

      # --- 4. REDE, MDNS E COMPARTILHAMENTO DE INFORMAÇÕES ---
      - avahi                        # Daemon mDNS que anuncia o nome do seu PC na rede local
      - avahi-libs
      - nss-mdns                     # Resolução de nomes local que expõe seu tráfego na rede doméstica
      - samba-client                 # Suporte a protocolos de rede da Microsoft
      - tcpdump                      # Utilitário de captura de pacotes (evita que exploits locais abusem dele)

      # --- 5. REPOSITÓRIOS E COMPONENTES COMERCIAIS/PROPRIETÁRIOS ---
      - firefox                      # Traz telemetria ativa e buscas integradas com a Google
      - fedora-bookmarks             # Links patrocinados no navegador
      - fedora-logos                 # Branding e marcas registradas comerciais
      - fedora-release-identity-basic
      - plymouth-theme-fedora        # Tema de inicialização proprietário da distro
      - gnome-tour                   # Guia promocional e comercial

      # --- 6. SUBSISTEMAS DE HARDWARE DESNECESSÁRIOS ---
      - cups                         # Sistema de impressão rodando 24/7 (Grande vetor de vulnerabilidades)
      - cups-filters
      - cups-libs
      - fprintd                      # Serviço de biometria/impressão digital
      - fprintd-pam
      - pcsc-lite                    # Suporte a Smart Cards e leitores de cartão criptográfico proprietários
      - wirelesstools                # Utilitários de rede sem fio obsoletos que não usam criptografia moderna

      # --- 7. EXTRAÇÃO DE MÍDIA E MULTIMÍDIA PADRÃO ---
      - totem                        # Player de vídeo padrão do GNOME que busca codecs externos
      - rygel                        # Servidor de mídia UPnP/DLNA que transmite seus arquivos na rede local

  - type: script
    scripts:
      - harden.sh
