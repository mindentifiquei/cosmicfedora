# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Local no repositório: recipes/recipe.yml
---
# A imagem será publicada em ghcr.io/<seu-usuario>/<name>
name: cosmic-hardened
description: Fedora COSMIC Atomic enxuto, sem telemetria e sem bloat.

# Base: Fedora COSMIC Atomic (builds do Atomic SIG no Quay).
# Confira se a tag existe antes do 1º build:
#   skopeo inspect docker://quay.io/fedora-ostree-desktops/cosmic-atomic:44 | head -n 5
base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
# Fixe uma versão do Fedora (número). Para atualizar de major, troque aqui
# (e confira que a tag existe). O workflow lê este valor para gerar a ISO,
# por isso ele precisa ser um número inteiro.
image-version: 44

modules:
  # ---------------------------------------------------------------------------
  # OPCIONAL — OpenSnitch (firewall de aplicações, controla conexões de saída).
  # Desativado por padrão: o pacote não está nos repositórios do Fedora, então
  # a instalação depende dos RPMs da página de Releases (e o OpenSnitch 1.8+
  # traz a interface em PyQt6, o que adiciona bibliotecas Qt à imagem).
  # Para ativar: 1) abra https://github.com/evilsocket/opensnitch/releases,
  # 2) confira a versão e os nomes exatos dos .rpm (daemon + UI),
  # 3) ajuste as URLs abaixo e descomente o bloco. O harden.sh habilita o
  # serviço sozinho quando o pacote estiver presente.
  # ---------------------------------------------------------------------------
  # - type: dnf
  #   install:
  #     packages:
  #       - https://github.com/evilsocket/opensnitch/releases/download/v1.8.0/opensnitch-1.8.0-1.x86_64.rpm
  #       - https://github.com/evilsocket/opensnitch/releases/download/v1.8.0/opensnitch-ui-1.8.0-1.noarch.rpm

  # Remoção de pacotes, serviços mascarados, sysctl, NetworkManager etc.
  # Arquivo: files/scripts/harden.sh
  - type: script
    scripts:
      - harden.sh

  # Navegador (o Firefox é removido pelo script). Instalado no primeiro boot,
  # com internet. Troque pelo navegador que preferir (ID do Flathub).
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - io.gitlab.librewolf-community

  # Políticas de assinatura (cosign) para o rebase/atualização verificados.
  # Mantenha por último.
  - type: signing
